<div class="form-container">
    <section class="form-intro">
        <span class="badge">Novo Voluntário</span>
        <h2>Faça parte do time</h2>
        <p>Preencha seus dados abaixo para se juntar ao Instituto Fiel ao Futuro.</p>
    </section>

    <form id="formCadastro">
        <fieldset>
            <legend>Dados Pessoais e Contato</legend>
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <!-- Atributo aria-required adicionado -->
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required aria-required="true">
                <!-- Span com aria-live="polite" preparado para injetar as validações do JS -->
                <span class="erro-mensagem" aria-live="polite"></span>
            </div>
            <div class="input-group">
                <label for="email">E-mail</label>
                <!-- Atributo aria-required adicionado -->
                <input type="email" id="email" name="email" placeholder="seu@email.com" required aria-required="true">
                <span class="erro-mensagem" aria-live="polite"></span>
            </div>
            <div class="input-group">
                <label for="telefone">WhatsApp</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
                <span class="erro-mensagem" aria-live="polite"></span>
            </div>
        </fieldset>

        <fieldset>
            <legend>Como você pode ajudar?</legend>
            <div class="input-group">
                <label for="area">Área de Interesse</label>
                <select id="area" name="area">
                    <option value="doacao">Doação de Materiais</option>
                    <option value="reforco">Professor (Reforço Escolar)</option>
                    <option value="treino">Auxiliar de Treinamento</option>
                    <option value="nutricao">Apoio na Nutrição (Terceiro Tempo)</option>
                </select>
            </div>
        </fieldset>

        <!-- Atributo aria-label adicionado ao botão de submissão -->
        <button type="submit" class="btn-primary" style="display: block; width: 100%; text-align: center;" aria-label="Enviar formulário de cadastro">Finalizar Cadastro</button>
    </form>

    <!-- Atributos role="dialog" e aria-modal="true" adicionados ao container do modal -->
    <div id="modalConfirmacao" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="titulo-modal">
        <div class="modal-content">
            <!-- ID adicionado para ser lido pelo aria-labelledby do modal -->
            <h3 id="titulo-modal" style="color: var(--cor-primaria); margin-bottom: 10px;">Cadastro Recebido! ⚽</h3>
            <p>Obrigado por querer fazer a diferença. Nossa equipe entrará em contato com você pelo WhatsApp em breve.</p>
            <!-- Atributo aria-label adicionado ao botão de fechar -->
            <a href="#cadastro" class="btn-primary modal-close" aria-label="Fechar janela de confirmação">Fechar</a>
        </div>
    </div>
</div>
