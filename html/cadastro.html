<div class="form-container">
    <section class="form-intro">
        <span class="badge">Novo Voluntário</span>
        <h2>Faça parte do time</h2>
        <p>Preencha seus dados abaixo para se juntar ao Instituto Fiel ao Futuro.</p>
    </section>

    <form id="formCadastro">
        <fieldset>
            <legend>Dados Pessoais e Contato</legend>
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>
            <div class="input-group">
                <label for="telefone">WhatsApp</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
            </div>
        </fieldset>

        <fieldset>
            <legend>Como você pode ajudar?</legend>
            <div class="input-group">
                <label for="area">Área de Interesse</label>
                <select id="area" name="area">
                    <option value="doacao">Doação de Materiais</option>
                    <option value="reforco">Professor (Reforço Escolar)</option>
                    <option value="treino">Auxiliar de Treinamento</option>
                    <option value="nutricao">Apoio na Nutrição (Terceiro Tempo)</option>
                </select>
            </div>
        </fieldset>

        <button type="submit" class="btn-primary" style="display: block; width: 100%; text-align: center;">Finalizar Cadastro</button>
    </form>

    <div id="modalConfirmacao" class="modal-overlay">
        <div class="modal-content">
            <h3 style="color: var(--cor-primaria); margin-bottom: 10px;">Cadastro Recebido! ⚽</h3>
            <p>Obrigado por querer fazer a diferença. Nossa equipe entrará em contato com você pelo WhatsApp em breve.</p>
            <a href="#cadastro" class="btn-primary modal-close">Fechar</a>
        </div>
    </div>
</div>
