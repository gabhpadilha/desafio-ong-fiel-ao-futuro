<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instituto Fiel ao Futuro | SPA</title>
    <meta name="description" content="Plataforma do Instituto Fiel ao Futuro para apresentação de projetos sociais e cadastro de voluntários.">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">
            <img src="img/logo.png" alt="Escudo alvinegro do Instituto Fiel ao Futuro">
            <h1>Fiel ao Futuro</h1>
        </div>
        
        <!-- Ocultado do leitor de ecrã para evitar confusão (aria-hidden) -->
        <input type="checkbox" id="bt_menu" class="checkbox-toggle" aria-hidden="true">
        
        <!-- Descrição da ação do botão de menu para invisuais (aria-label) -->
        <label for="bt_menu" class="menu-toggle" aria-label="Abrir menu de navegação">&#9776;</label>

        <!-- Identificação clara da navegação principal -->
        <nav class="nav-menu" aria-label="Menu principal">
            <ul>
                <!-- Links atualizados para a SPA -->
                <li><a href="#inicio">Início</a></li>
                <li><a href="#projetos">Projetos</a></li>
                <li><a href="#cadastro">Engajamento</a></li>
            </ul>
        </nav>
    </header>

    <!-- Reforço estrutural (role="main") -->
    <main id="app" role="main">
        <!-- O JS vai injetar o miolo aqui dentro -->
    </main>

    <footer>
        <p>&copy; 2026 Instituto Fiel ao Futuro. Organização sem fins lucrativos.</p>
    </footer>

    <script type="module" src="js/main.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</body>
</html>
